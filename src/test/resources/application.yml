# Configuracion de tests: H2 en modo PostgreSQL + las mismas migraciones Flyway que produccion.
spring:
  datasource:
    url: jdbc:h2:mem:boxschool;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate      # si una entidad no coincide con las migraciones, el test falla
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktdGVzdC1vbmx5LXNlY3JldC1rZXktMDEyMzQ1Njc4OQ==
  expiration-minutes: 60

app:
  timezone: UTC
  membership-reminder:
    enabled: false
    days-before-expiry: 2
  rate-limit:
    auth-requests-per-minute: 1000
  bootstrap-admin:
    username: ""
    password: ""
