# Configuracion base. NO contiene secretos: todo valor sensible llega por variables de entorno
# (ver .env.example y docs/DECISIONS.md D-010). El perfil "dev" ajusta lo propio de desarrollo.
spring:
  application:
    name: box-school

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo gestiona Flyway; Hibernate solo valida que coincida
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    # SOLO para la primera adopcion de una BD creada antes de Flyway con ddl-auto=update (se toma como V1).
    # Apagado por defecto: con una base ajena y no vacia marcaria un baseline en la base equivocada.
    # Primera vez en una base heredada: FLYWAY_BASELINE_ON_MIGRATE=true (ver README).
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  # Correo: se activa SOLO si defines SPRING_MAIL_HOST (+ SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
  # Sin host, la app arranca igual y los recordatorios se omiten con un warning.
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  mvc:
    formcontent:
      filter:
        enabled: false   # API solo JSON. OrderedFormContentFilter copiaba a memoria el cuerpo COMPLETO de cualquier
                         # PUT/PATCH/DELETE form-urlencoded, anonimo y antes de la cadena de seguridad (OOM; auditoria N-1)

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  shutdown: graceful
  # "native" cuando haya un proxy/balanceador delante, para que el rate limit vea la IP real del cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false   # el indicador de correo abriria una conexion SMTP por cada consulta de salud
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    # Hibernate escribe 'Detail: Key (email)=(...)' (datos personales) en cada violacion de unicidad;
    # el GlobalExceptionHandler ya registra lo necesario sin valores (auditoria R-6). dev lo vuelve a activar.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

jwt:
  secret: ${JWT_SECRET}                          # Base64, minimo 32 bytes. Generar con util.GenerateJwtSecret
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

app:
  timezone: ${APP_TIMEZONE:America/Bogota}       # zona del negocio; no depender de la del servidor (la nube suele estar en UTC)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}   # separados por coma
  mail:
    from: ${MAIL_FROM:}                          # vacio = usa SPRING_MAIL_USERNAME
  membership-reminder:
    enabled: ${REMINDER_ENABLED:true}
    days-before-expiry: ${REMINDER_DAYS_BEFORE:2}
    cron: ${REMINDER_CRON:0 0 8 * * *}           # segundos min hora dia mes dia-semana
    delay-between-emails-ms: ${REMINDER_DELAY_MS:1000}   # pausa entre correos (limite de envios/segundo del proveedor)
  registration:
    code-validity-hours: ${REGISTRATION_CODE_HOURS:72}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  password-reset:
    token-validity-minutes: ${PASSWORD_RESET_MINUTES:30}
    resend-cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}
    url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}   # pagina del frontend; en produccion, la real
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
